{% set goname = "github.com/rclone/rclone" %}
{% set version = "1.75.2" %}

{% set name = goname.split('/')[-1] %}
{% set pkg_src = ('src/'+goname).replace("/",os.sep) %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://{{ goname }}/archive/v{{ version }}.tar.gz
  sha256: 68afd7f68c84bd978966feae2116339aa7bf454b39c573910c462e87c3774d5a

build:
  number: 1
  script:
    # fs.Version: otherwise `rclone version` reports "v{{ version }}-DEV" (upstream's release builds set it the same way)
    - go build -v -ldflags "-X {{ goname }}/fs.Version=v{{ version }}" -o {{ target_gobin }}{{ name }}{{ target_goexe }}  # [not win]
    # cmount tag: adds `rclone mount` on Windows (WinFsp, loaded at run time; builds without cgo, like upstream's release)
    - go build -v -tags cmount -ldflags "-X {{ goname }}/fs.Version=v{{ version }}" -o {{ target_gobin }}{{ name }}{{ target_goexe }}  # [win]

requirements:
  build:
    - {{ compiler("go") }} >=1.13

test:
  commands:
    - rclone version
    - rclone version | grep -x "rclone v{{ version }}"  # [not win]
    - rclone version | findstr /B /C:"rclone v{{ version }}"  # [win]
    - rclone mount --help  # [win]

about:
  home: https://rclone.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: |
    Rclone ("rsync for cloud storage") is a command line program to
    sync files and directories to and from different cloud storage providers.
  doc_url: https://rclone.org/docs/
  dev_url: https://github.com/rclone/rclone

extra:
  recipe-maintainers:
    - luizirber
